services:
  # The Node.js Backend Server
  - type: web
    name: anonymous-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    # Automatically connect the backend to the database created below
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anonymous-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: USE_MOCK_AI
        value: false
      - key: GEMINI_API_KEY
        sync: false # You will need to manually paste your Gemini key in the Render dashboard

  # The PostgreSQL Database
databases:
  - name: anonymous-db
    plan: free # Uses the free tier for PostgreSQL
    databaseName: asirs_db
    user: asirs_admin
